# Squid forward proxy — strict whitelist
# Only allows the backend to reach Wikidata and Wikimedia Commons.

acl allowed_sites dstdomain query.wikidata.org
acl allowed_sites dstdomain commons.wikimedia.org
acl allowed_sites dstdomain www.wikidata.org

# Allow CONNECT (HTTPS tunneling) only for whitelisted domains
acl CONNECT method CONNECT
http_access allow CONNECT allowed_sites
http_access allow allowed_sites
http_access deny all

http_port 3128

# Explicit DNS — Docker's embedded DNS only resolves container names
dns_nameservers 8.8.8.8 1.1.1.1

# No disk cache — we cache in Node.js anyway
cache deny all

# Suppress verbose logs
access_log none
